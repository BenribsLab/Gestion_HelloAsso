server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 15m;

  root /usr/share/nginx/html;
  index index.html;

  # Google (apis.google.com, docs.google.com) : uniquement pour la fenêtre de sélection de dossier
  # Google Drive de l'extension Export Google Sheets (Google Picker).
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://apis.google.com https://*.googleapis.com; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://docs.google.com https://drive.google.com https://accounts.google.com https://content.googleapis.com; img-src 'self' data: https://ssl.gstatic.com https://*.googleusercontent.com; object-src 'none'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com https://ssl.gstatic.com" always;
  # Origine seule vers les autres sites (jamais le chemin complet) : nécessaire à la clé d'API
  # Google, restreinte aux sites *.gestion-asso.fr, pour la fenêtre de choix du dossier Drive.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    # Porté à 1800s (au lieu de 300s) : les connexions WebSocket de relais navigateur distant
    # (extension ffe-licensing) peuvent rester ouvertes longtemps pendant qu'un utilisateur
    # revoit/valide une page en direct, sans trafic constant pour les garder vivantes autrement.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Nécessaire pour laisser passer l'upgrade WebSocket (relais navigateur distant) — sans effet
    # sur les requêtes HTTP normales.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location ~* ^/assets/.*\.(?:css|js|woff2?|png|svg)$ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
