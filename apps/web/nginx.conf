server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 15m;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Photo d'une compétition (extension Compétitions) : publique et affichable par le site du
  # club (WordPress…). Les en-têtes du serveur ne sont pas hérités ici : on les répète.
  location ~ ^/api/v1/competitions/photos/[^/]+$ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cross-Origin-Resource-Policy;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    # Porté à 1800s (au lieu de 300s) : les connexions WebSocket de relais navigateur distant
    # (extension ffe-licensing) peuvent rester ouvertes longtemps pendant qu'un utilisateur
    # revoit/valide une page en direct, sans trafic constant pour les garder vivantes autrement.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Nécessaire pour laisser passer l'upgrade WebSocket (relais navigateur distant) — sans effet
    # sur les requêtes HTTP normales.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # Fenêtre de choix de dossier Google Drive (extension Export Google Sheets), ouverte dans un
  # cadre par l'application. Le chargeur Google insère ses propres scripts et styles : cette
  # page isolée, sans donnée du club, est la seule à les autoriser. Les en-têtes du serveur ne
  # sont pas hérités dans un bloc qui en définit : ils sont tous répétés ici.
  location = /google-picker.html {
    expires -1;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://*.google.com https://*.googleapis.com; font-src 'self' https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'self'; frame-src https://docs.google.com https://drive.google.com https://accounts.google.com https://content.googleapis.com; img-src 'self' data: https://*.gstatic.com https://*.googleusercontent.com https://*.google.com; object-src 'none'; script-src 'self' 'unsafe-inline' https://apis.google.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://*.gstatic.com https://apis.google.com" always;
    # Origine seule (jamais le chemin) : la clé d'API Google est restreinte aux sites *.gestion-asso.fr.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  location ~* ^/assets/.*\.(?:css|js|woff2?|png|svg)$ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
