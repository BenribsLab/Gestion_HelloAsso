name: gestion-utilisateurs

services:
  database:
    image: gestion-utilisateurs-database:latest
    build:
      context: .
      dockerfile: apps/database/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_utilisateurs}
      POSTGRES_USER: ${POSTGRES_USER:-gestion_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-gestion_app}:${POSTGRES_PASSWORD:-local-dev-change-me}@database:5432/${POSTGRES_DB:-gestion_utilisateurs}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:18473}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrateur CEY}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      SETTINGS_ENCRYPTION_KEY_FILE: ${SETTINGS_ENCRYPTION_KEY_FILE:-}
      HELLOASSO_BASE_URL: ${HELLOASSO_BASE_URL:-https://api.helloasso-sandbox.com}
      HELLOASSO_CLIENT_ID: ${HELLOASSO_CLIENT_ID:-}
      HELLOASSO_CLIENT_SECRET: ${HELLOASSO_CLIENT_SECRET:-}
      HELLOASSO_ORGANIZATION_SLUG: ${HELLOASSO_ORGANIZATION_SLUG:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.mail.ovh.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Cercle d'Escrime de Yerres}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      EXTENSIONS_BUNDLED_DIRECTORY: /app/bundled-plugins
      EXTENSIONS_DIRECTORY: /app/plugins
      EXTENSION_CATALOG_URL: ${EXTENSION_CATALOG_URL:-}
      EXTENSION_LICENSE_TOKEN: ${EXTENSION_LICENSE_TOKEN:-}
      EXTENSION_LICENSE_PUBLIC_KEY: ${EXTENSION_LICENSE_PUBLIC_KEY:-}
      EXTENSION_LICENSE_PUBLIC_KEY_BASE64: ${EXTENSION_LICENSE_PUBLIC_KEY_BASE64:-}
      EXTENSION_LICENSE_PUBLIC_KEY_FILE: ${EXTENSION_LICENSE_PUBLIC_KEY_FILE:-}
      EXTENSION_OFFLINE_GRACE_DAYS: ${EXTENSION_OFFLINE_GRACE_DAYS:-30}
      EXTENSION_ALLOW_UNSIGNED: ${EXTENSION_ALLOW_UNSIGNED:-false}
      # Utilisé par l'extension ffe-licensing (host.config) pour joindre le service dédié qui
      # pilote le navigateur — jamais exposé au-delà de ce conteneur ni du réseau interne.
      FFE_BROWSER_URL: ${FFE_BROWSER_URL:-http://ffe-browser:4000}
      FFE_BROWSER_INTERNAL_TOKEN: ${FFE_BROWSER_INTERNAL_TOKEN:-}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18474}:3000"
    volumes:
      - plugin_data:/app/plugins
      # Vide par défaut (Docker crée le dossier hôte s'il n'existe pas encore) : n'a d'effet
      # que si EXTENSION_LICENSE_PUBLIC_KEY_FILE pointe vers un fichier posé dedans, par ex.
      # ./secrets/catalog-public.pem -> /app/secrets/catalog-public.pem.
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - frontend
      - backend

  # Seul composant du dépôt à porter une dépendance lourde/à risque (binaire Chromium natif) —
  # isolé dans son propre service plutôt qu'embarqué dans apps/api, jamais distribué dans un
  # .gu-plugin signé. Jamais exposé publiquement, jamais sur le réseau frontend : atteignable
  # uniquement depuis api, sur backend, protégé en plus par un secret partagé applicatif.
  ffe-browser:
    build:
      context: .
      dockerfile: services/ffe-browser/Dockerfile
    environment:
      PORT: 4000
      FFE_BROWSER_INTERNAL_TOKEN: ${FFE_BROWSER_INTERNAL_TOKEN:-}
      SESSIONS_DIRECTORY: /data/sessions
    volumes:
      - ffe_browser_sessions:/data/sessions
    # Chromium a besoin de plus que les 64 Mo par défaut de /dev/shm, sous peine de crash aléatoire
    # en cours de rendu de page.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend
      # backend est "internal: true" (aucune sortie internet) : ce réseau dédié, non interne,
      # sert uniquement à atteindre dirigeant.escrime-ffe.fr — aucun autre service dessus.
      - ffe_egress

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-18473}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - frontend

volumes:
  postgres_data:
  plugin_data:
  ffe_browser_sessions:

networks:
  frontend:
  backend:
    internal: true
  ffe_egress:
